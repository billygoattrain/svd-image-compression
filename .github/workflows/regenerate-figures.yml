name: Regenerate SVD project figures
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_figures.py'
      - '.github/workflows/regenerate-figures.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_figures.py
      - name: Commit updated PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/error_vs_ratio.png figures/angles.png
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate camera-text and rotated-stripe figures"
            git push
          fi
